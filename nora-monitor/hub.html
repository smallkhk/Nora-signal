<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #eef2ff;
    }
    .container {
      width: min(900px, 100%);
      margin: auto;
      padding: 30px 18px;
    }
    .card {
      background: #121a2d;
      border: 1px solid #263452;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }
    .muted {
      color: #9aa8c7;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 15px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.connected {
      background: #22c55e;
    }
    #agents {
      margin-top: 15px;
      display: grid;
      gap: 10px;
    }
    .agent {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 15px;
      border-radius: 12px;
      background: #0d1527;
      border: 1px solid #263452;
    }
    .agent-name {
      font-weight: 600;
    }
    .online {
      padding: 5px 10px;
      border-radius: 999px;
      background: #15351f;
      color: #86efac;
      font-size: 12px;
      font-weight: 600;
    }
    .empty {
      padding: 18px 0;
      color: #8d9ab5;
    }
    .error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Hub</h1>
    <div class="muted">
      Socket.IO connection monitor
    </div>
    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>
  <div class="card">
    <strong>Connected Agents</strong>
    <div id="agents">
      <div class="empty">
        No agents connected.
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const agentsContainer = document.getElementById("agents");
  const agents = new Map();
  function setStatus(connected, message) {
    statusText.textContent = message;
    if (connected) {
      statusDot.classList.add("connected");
    } else {
      statusDot.classList.remove("connected");
    }
  }
  function renderAgents() {
    agentsContainer.innerHTML = "";
    if (agents.size === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No agents connected.";
      agentsContainer.appendChild(empty);
      return;
    }
    for (const name of agents.keys()) {
      const row = document.createElement("div");
      row.className = "agent";
      const nameElement = document.createElement("span");
      nameElement.className = "agent-name";
      nameElement.textContent = name;
      const statusElement = document.createElement("span");
      statusElement.className = "online";
      statusElement.textContent = "ONLINE";
      row.appendChild(nameElement);
      row.appendChild(statusElement);
      agentsContainer.appendChild(row);
    }
  }
  /*
   * IMPORTANT:
   *
   * Do NOT connect directly to 127.0.0.1:5050.
   *
   * The browser connects to:
   *
   * https://mon.eclipselivecam.online/socket.io/
   *
   * LiteSpeed then handles the request.
   */
  const socket = io({
    path: "/socket.io/",
    transports: [
      "websocket",
      "polling"
    ],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000,
    timeout: 10000
  });
  socket.on("connect", () => {
    console.log(
      "Socket.IO connected:",
      socket.id
    );
    setStatus(
      true,
      "Connected"
    );
    /*
     * Register this browser as the hub.
     *
     * Your relay.py already listens for:
     *
     * @socketio.on("register")
     */
    socket.emit(
      "register",
      {
        name: "hub"
      }
    );
  });
  socket.on("connect_error", (error) => {
    console.error(
      "Socket.IO connection error:",
      error
    );
    setStatus(
      false,
      "Connection error"
    );
  });
  socket.on("disconnect", (reason) => {
    console.log(
      "Socket.IO disconnected:",
      reason
    );
    setStatus(
      false,
      "Disconnected"
    );
  });
  /*
   * Agent connected.
   */
  socket.on("agent_up", (data) => {
    console.log(
      "Agent connected:",
      data
    );
    if (
      data &&
      data.name
    ) {
      agents.set(
        data.name,
        true
      );
      renderAgents();
    }
  });
  /*
   * Agent disconnected.
   */
  socket.on("agent_down", (data) => {
    console.log(
      "Agent disconnected:",
      data
    );
    if (
      data &&
      data.name
    ) {
      agents.delete(
        data.name
      );
      renderAgents();
    }
  });
  socket.on("ok", () => {
    console.log(
      "Hub registration successful"
    );
  });
  renderAgents();
})();
</script>
</body>
</html>
