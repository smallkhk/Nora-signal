name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
      - claude/**
    paths:
      - 'ios-viewer/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document 2>/dev/null || true

      - name: Generate Xcode project
        working-directory: ios-viewer
        run: xcodegen generate

      - name: Build app (no code sign)
        working-directory: ios-viewer
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild build \
            -project NoraViewer.xcodeproj \
            -scheme NoraViewer \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            SKIP_INSTALL=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::group::Full xcodebuild log (last 300 lines)"
            tail -n 300 /tmp/xcodebuild.log
            echo "::endgroup::"
            echo "::error::xcodebuild failed with status $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

      - name: Package IPA (unsigned)
        run: |
          APP=$(find "$RUNNER_TEMP/build" -name "*.app" -maxdepth 2 | head -1)
          if [ -z "$APP" ]; then echo "ERROR: .app not found"; find "$RUNNER_TEMP/build" -ls; exit 1; fi
          echo "Packaging: $APP"
          ls -lh "$APP"
          mkdir -p /tmp/ipa/Payload
          cp -r "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa
          zip -r "$RUNNER_TEMP/NoraViewer.ipa" Payload/
          ls -lh "$RUNNER_TEMP/NoraViewer.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoraViewer-IPA
          path: ${{ runner.temp }}/NoraViewer.ipa
          retention-days: 30

      - name: Upload IPA to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ runner.temp }}/NoraViewer.ipa
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
