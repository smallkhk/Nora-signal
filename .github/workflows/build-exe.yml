name: Build NoraMonitor EXE

on:
  push:
    branches:
      - claude/legitimate-keylogger-lm3rqu
    paths:
      - 'nora-monitor/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: nora-monitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyaudio pytesseract

      - name: Inject build tag into app.py
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAG="nora-monitor-${SHORT}"
          sed -i "s/nora-monitor-UNKNOWN/${TAG}/" nora-monitor/app.py
          echo "Injected tag: $TAG"

      - name: Build EXE
        working-directory: nora-monitor
        run: pyinstaller nora.spec

      - name: Upload artifact (30-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: NoraMonitor-EXE
          path: nora-monitor/dist/NoraMonitor.exe
          retention-days: 30

      - name: Get short SHA
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nora-monitor-${{ steps.sha.outputs.short }}
          name: "NoraMonitor ${{ steps.sha.outputs.short }}"
          body: |
            Auto-built from branch `claude/legitimate-keylogger-lm3rqu`
            Commit: ${{ github.sha }}
          files: nora-monitor/dist/NoraMonitor.exe
          make_latest: true
