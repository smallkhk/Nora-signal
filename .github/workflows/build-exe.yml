name: Build NoraMonitor EXE

on:
  push:
    branches:
      - claude/legitimate-keylogger-lm3rqu
    paths:
      - 'nora-monitor/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install all Python dependencies from requirements.txt
      - name: Install Python dependencies
        working-directory: nora-monitor
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      # pywin32 needs a post-install script to register its DLLs properly
      - name: Run pywin32 post-install
        shell: bash
        run: python -m pywin32_postinstall -install || true

      - name: Inject build tag into app.py
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAG="nora-monitor-${SHORT}"
          sed -i "s/nora-monitor-UNKNOWN/${TAG}/" nora-monitor/app.py
          echo "Injected build tag: $TAG"

      - name: Build EXE
        working-directory: nora-monitor
        shell: bash
        run: |
          pyinstaller nora.spec --clean --noconfirm
          echo "--- Build output ---"
          ls -lh dist/

      - name: Verify EXE exists and report size
        shell: pwsh
        run: |
          $exe = "nora-monitor\dist\SyncHost.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "SyncHost.exe was not produced!"
            exit 1
          }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "SyncHost.exe size: $mb MB"

      - name: Upload artifact (30-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: SyncHost-EXE
          path: nora-monitor/dist/SyncHost.exe
          retention-days: 30

