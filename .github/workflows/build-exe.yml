name: Build NoraMonitor EXE

on:
  push:
    branches:
      - claude/legitimate-keylogger-lm3rqu
    paths:
      - 'nora-monitor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: nora-monitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyaudio

      - name: Build EXE
        working-directory: nora-monitor
        run: pyinstaller nora.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoraMonitor-EXE
          path: nora-monitor/dist/NoraMonitor.exe
          retention-days: 30
