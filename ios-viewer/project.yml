name: NoraViewer
options:
  bundleIdPrefix: com.noraviewer
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_ENTITLEMENTS: ""
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.noraviewer.app

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "131.0.0"

targets:
  NoraViewer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - ExportOptions.plist
          - README.md
          - "*.xcodeproj/**"
          - "*.xcworkspace/**"
    dependencies:
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_NAME: NoraViewer
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Nora Viewer"
        CFBundleIdentifier: com.noraviewer.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Used for camera monitoring"
        NSMicrophoneUsageDescription: "Used for microphone monitoring"
        NSLocalNetworkUsageDescription: "Connects to local relay server"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
